<!DOCTYPE html>
<html lang="en" style="touch-action:manipulation">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Papercore</title>
  <link rel="icon" type="image/png" href="./Paper.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { margin:0; overflow:hidden; font-family:"Poppins",sans-serif; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    canvas { display:block; }
    #blocker { position:fixed; inset:0; background:linear-gradient(135deg,#e0e0e0,#ffffff); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:10; }
    #blocker h1 { font-size:48px; font-weight:900; text-shadow:2px 2px 0 #000; letter-spacing:4px; margin-bottom:30px; }
    #playBtn { padding:15px 40px; font-size:22px; font-weight:700; border:3px solid black; background:white; cursor:pointer; box-shadow:4px 4px 0 black; transition:0.15s; font-family:"Poppins",sans-serif; color:#000; }
    #playBtn:hover { background:#eee; transform:translate(-2px,-2px); box-shadow:6px 6px 0 black; }
    #playBtn:active { transform:translate(0,0); box-shadow:4px 4px 0 black; }
    .setting { margin-top:20px; display:flex; align-items:center; gap:12px; font-size:16px; font-weight:400; color:#333; }
    .setting input { width:140px; accent-color:#8b5cf6; }
    .setting input[type="range"] { -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:linear-gradient(90deg,#c4b5fd,#8b5cf6); outline:none; cursor:pointer; }
    .setting input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#6d28d9; border:2px solid #ddd6fe; cursor:pointer; box-shadow:0 0 4px rgba(0,0,0,0.3); }
    .setting input[type="range"]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#6d28d9; border:2px solid #ddd6fe; cursor:pointer; }
    .setting input[type="text"] { width:120px; padding:6px 10px; font-size:14px; font-family:"Poppins",sans-serif; border:2px solid #c4b5fd; border-radius:6px; outline:none; text-align:center; background:white; }
    #fps { position:fixed; top:10px; right:10px; color:#fff; font-size:15px; font-weight:700; pointer-events:none; z-index:5; text-shadow:0 0 4px rgba(0,0,0,0.7); display:none; user-select:none; font-family:"Poppins",sans-serif; }
    #crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:28px; font-weight:700; pointer-events:none; z-index:5; text-shadow:0 0 3px rgba(0,0,0,0.6); display:none; user-select:none; }
    #health-bar { position:fixed; bottom:14%; left:50%; transform:translateX(-50%); z-index:5; display:none; align-items:center; gap:8px; user-select:none; pointer-events:none; }
    #health-bar .hp-icon { font-size:20px; color:#ef4444; text-shadow:0 0 4px rgba(0,0,0,0.5); }
    #health-bar .hp-text { color:#fff; font-size:16px; font-weight:700; text-shadow:0 0 4px rgba(0,0,0,0.7); min-width:40px; text-align:center; font-family:"Poppins",sans-serif; }
    #health-bar .hp-bg { width:120px; height:12px; background:rgba(0,0,0,0.4); border-radius:6px; overflow:hidden; border:1px solid rgba(255,255,255,0.2); }
    #health-bar .hp-fill { height:100%; background:linear-gradient(90deg,#22c55e,#16a34a); border-radius:6px; transition: none !important; }
    #inventory { position:fixed; bottom:15px; left:50%; transform:translateX(-50%); display:none; gap:6px; z-index:20; }
    #making { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:30; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); }
    #making .window { background:linear-gradient(135deg,#f5f3ff,#e0e7ff); border:3px solid #8b5cf6; border-radius:16px; padding:24px; min-width:340px; max-width:400px; box-shadow:0 0 40px rgba(139,92,246,0.3); }

    #making h2 { margin:0 0 16px; font-size:24px; color:#4c1d95; text-align:center; font-weight:900; }

    #making .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-height:92px; overflow-y:auto; padding-right:4px; -webkit-overflow-scrolling:touch; }

    #making .grid::-webkit-scrollbar { width:4px; }
    #making .grid::-webkit-scrollbar-thumb { background:#c4b5fd; border-radius:4px; }
    #making .card { width:90px; padding:10px 6px; background:rgba(255,255,255,0.7); border:2px solid #ddd6fe; border-radius:10px; cursor:pointer; text-align:center; transition:0.15s; box-sizing:border-box; }
    #making .card:hover { border-color:#8b5cf6; }
    #making .card.selected { border-color:#6d28d9; background:#ede9fe; box-shadow:0 0 8px rgba(109,40,217,0.25); }
    #making .card img { width:36px; height:36px; object-fit:contain; display:block; margin:0 auto 4px; }
    #making .card .name { font-size:11px; font-weight:700; color:#4c1d95; }
    #making .card .cost { font-size:10px; color:#6b7280; margin-top:2px; }
    #making .card .cost img { width:12px; height:12px; display:inline; vertical-align:middle; margin:0 1px; }
    #making .footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid #ddd6fe; }
    #making .footer .hint { font-size:12px; color:#6b7280; }
    #making .footer button { padding:10px 28px; font-size:15px; font-weight:700; border:2px solid #6d28d9; background:#8b5cf6; color:#fff; border-radius:8px; cursor:pointer; font-family:"Poppins",sans-serif; transition:0.15s; }
    #making .footer button:hover { background:#7c3aed; transform:translateY(-1px); }
    #making .footer button:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    #making .close-hint { text-align:center; color:#6b7280; font-size:12px; margin-top:10px; }
    .slot { width:50px; height:50px; border:2px solid #555; background:rgba(200,200,200,0.6); border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative; backdrop-filter:blur(2px); }
    .slot.selected { border-color:#fff; background:rgba(255,255,255,0.8); }
    .item-img { width:36px; height:36px; object-fit:contain; }
    .count { position:absolute; bottom:1px; right:4px; font-size:13px; font-weight:700; color:#222; text-shadow:0 0 3px #fff; }
    @media (pointer:coarse) {
      .slot { width:36px; height:36px; border-radius:7px; }
      .item-img { width:26px; height:26px; }
      .count { font-size:10px; }
    }
    #mobile-controls { position:fixed; inset:0; z-index:15; display:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    #joystick-zone { position:absolute; left:14px; bottom:22px; width:140px; height:140px; }
    #joystick-base { width:100%; height:100%; border-radius:50%; background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.4); position:relative; }
    #joystick-knob { width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,0.6); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
    #touch-look { position:absolute; inset:0; z-index:-1; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .mb { position:absolute; padding:8px 12px; font-size:12px; font-weight:700; border:2px solid rgba(255,255,255,0.4); border-radius:10px; background:rgba(255,255,255,0.2); color:#fff; font-family:"Poppins",sans-serif; user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .mb:active { background:rgba(255,255,255,0.45); }
    #btn-jump { right:18px; bottom:70px; border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center; font-size:14px; }
    #btn-make { right:18px; top:16px; }
    #btn-pause { right:18px; top:76px; font-size:11px; padding:6px 10px; }
    #btn-tp { right:18px; top:132px; font-size:11px; padding:6px 10px; }
    #btn-break, #btn-place { display:none; }
    #pause-overlay { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; }
    #pause-overlay .pause-window { background:linear-gradient(135deg,#f5f3ff,#e0e7ff); border:3px solid #8b5cf6; border-radius:16px; padding:30px; text-align:center; box-shadow:0 0 40px rgba(139,92,246,0.3); }
    #pause-overlay h2 { margin:0 0 20px; font-size:28px; color:#4c1d95; font-weight:900; }
    #pause-overlay button { display:block; width:200px; margin:10px auto; padding:12px 20px; font-size:16px; font-weight:700; border:2px solid #6d28d9; border-radius:8px; background:#8b5cf6; color:#fff; cursor:pointer; font-family:"Poppins",sans-serif; }
    #cheatInput:focus { border-color:#8b5cf6 !important; box-shadow:0 0 0 3px rgba(139,92,246,0.2); }
    #pause-overlay button:hover { background:#7c3aed; }
    .toggle { position:relative; display:inline-block; width:44px; height:24px; flex-shrink:0; cursor:pointer; }
    .toggle input { opacity:0; width:0; height:0; }
    .toggle .slider { position:absolute; inset:0; background:#c4b5fd; border-radius:24px; transition:0.25s; }
    .toggle .slider::before { content:''; position:absolute; left:3px; bottom:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:0.25s; }
    .toggle input:checked + .slider { background:#6d28d9; }
    .toggle input:checked + .slider::before { transform:translateX(20px); }
    @media (pointer:coarse) {
      #pause-overlay button, #death-overlay button { width:160px; padding:10px 16px; font-size:14px; margin:6px auto; }
      #pause-overlay .pause-window { padding:20px; }
      #pause-overlay h2 { font-size:22px; margin:0 0 14px; }
      .setting { font-size:14px; gap:8px; margin-top:12px; }
      #cheatInput { width:140px !important; font-size:13px !important; }
    }
    #death-overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; }
    #death-overlay .death-window { background:linear-gradient(135deg,#1e1b4b,#0f0d2e); border:3px solid #991b1b; border-radius:16px; padding:40px; text-align:center; box-shadow:0 0 60px rgba(153,27,27,0.4); }
    #death-overlay h2 { margin:0 0 20px; font-size:36px; color:#ef4444; font-weight:900; text-shadow:0 0 20px rgba(239,68,68,0.5); }
    #death-overlay button { display:block; width:200px; margin:10px auto; padding:12px 20px; font-size:16px; font-weight:700; border:2px solid #6d28d9; border-radius:8px; background:#8b5cf6; color:#fff; cursor:pointer; font-family:"Poppins",sans-serif; }
    #death-overlay button:hover { background:#7c3aed; }
    #crate-ui { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; }
    #crate-ui .window { background:linear-gradient(135deg,#fef9e7,#fae5d3); border:3px solid #d35400; border-radius:16px; padding:24px; max-width:600px; width:90%; box-shadow:0 0 40px rgba(211,84,0,0.3); }
    #crate-ui h2 { margin:0 0 16px; text-align:center; font-size:22px; color:#a04000; font-weight:900; }
    #crate-ui .section { margin-bottom:16px; }
    #crate-ui .section h3 { margin:0 0 8px; font-size:14px; color:#6e2c00; }
    #crate-ui .grid { display:flex; flex-wrap:wrap; gap:4px; }
    #crate-ui .grid .cs { width:48px; height:48px; border:2px solid #d35400; border-radius:6px; background:#fff8e7; cursor:pointer; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    #crate-ui .grid .cs img { max-width:80%; max-height:80%; pointer-events:none; }
    #crate-ui .grid .cs .cc { position:absolute; bottom:1px; right:3px; font-size:11px; font-weight:700; color:#333; pointer-events:none; }
    #crate-ui .close-crate { display:block; margin:8px auto 0; padding:8px 20px; font-size:14px; font-weight:700; border:2px solid #d35400; border-radius:8px; background:white; cursor:pointer; }
    @media (max-width:600px) {
      #crate-ui .window { padding:12px; }
      #crate-ui h2 { font-size:16px; margin:0 0 10px; }
      #crate-ui .grid { gap:3px; }
      #crate-ui .grid .cs { width:36px; height:36px; border-width:1.5px; border-radius:4px; }
      #crate-ui .grid .cs img { max-width:70%; max-height:70%; }
      #crate-ui .grid .cs .cc { font-size:9px; }
      #crate-ui .section { margin-bottom:10px; }
      #crate-ui .section h3 { font-size:12px; margin:0 0 4px; }
      #crate-ui .close-crate { padding:6px 14px; font-size:12px; }
    }
    #move-dialog { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; }
    #move-dialog .md-window { background:linear-gradient(135deg,#fef9e7,#fae5d3); border:3px solid #d35400; border-radius:12px; padding:20px; max-width:260px; width:80%; text-align:center; box-shadow:0 0 30px rgba(211,84,0,0.3); }
    #move-dialog .md-window p { margin:0 0 12px; font-size:15px; color:#333; font-weight:600; }
    #move-dialog .md-window input { width:70px; padding:6px; font-size:16px; text-align:center; border:2px solid #d35400; border-radius:6px; outline:none; }
    #move-dialog .md-window .md-error { color:#dc2626; font-size:12px; font-weight:600; margin:6px 0 0; min-height:16px; }
    #move-dialog .md-window .md-buttons { margin-top:12px; display:flex; gap:8px; justify-content:center; }
    #move-dialog .md-window .md-buttons button { padding:6px 16px; font-size:13px; font-weight:700; border:2px solid #d35400; border-radius:6px; cursor:pointer; background:white; font-family:"Poppins",sans-serif; }
    #move-dialog .md-window .md-buttons button:first-child { background:#d35400; color:white; }
  </style>
</head>
<body>
  <div id="blocker">
    <h1>PAPERCORE</h1>
    <button id="playBtn">PLAY</button>
    <div class="setting">
      <label for="wsInput">World Size (width-height-depth):</label>
      <input type="text" id="wsInput" value="200-100-200" placeholder="e.g. 200-100-200">
    </div>
    <div class="setting">
      <label for="rdSlider">Render Distance:</label>
      <input type="range" id="rdSlider" min="8" max="150" value="20" step="1">
      <span id="rdValue">20</span>
    </div>
  </div>
  </div>

  <div id="crosshair">+</div>
  <div id="fps">0 FPS</div>
  <div id="health-bar">
    <span class="hp-icon">❤</span>
    <div class="hp-bg"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
    <span class="hp-text" id="hpText">20/20</span>
  </div>

  <div id="inventory">
    <div class="slot" id="slot1"></div>
    <div class="slot" id="slot2"></div>
    <div class="slot" id="slot3"></div>
    <div class="slot" id="slot4"></div>
    <div class="slot" id="slot5"></div>
    <div class="slot" id="slot6"></div>
    <div class="slot" id="slot7"></div>
    <div class="slot" id="slot8"></div>
  </div>

  <div id="mobile-controls">
    <div id="touch-look"></div>
    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
    <button class="mb" id="btn-jump">JUMP</button>
    <button class="mb" id="btn-break" style="display:none">BREAK</button>
    <button class="mb" id="btn-place" style="display:none">PLACE</button>
    <button class="mb" id="btn-make">MAKE</button>
    <button class="mb" id="btn-pause">PAUSE</button>
    <button class="mb" id="btn-tp">TP</button>
  </div>

  <div id="pause-overlay">
    <div class="pause-window">
      <h2>PAUSED</h2>
      <div class="setting">
        <label>Render Distance:</label>
        <input type="range" id="rdSlider2" min="8" max="150" value="20" step="1">
        <span id="rdValue2">20</span>
      </div>
      <div class="setting">
        <label>Sensitivity:</label>
        <input type="range" id="sensSlider" min="1" max="20" value="5" step="1">
        <span id="sensValue">5</span>
      </div>
      <div class="setting">
        <label>Autosave:</label>
        <label class="toggle"><input type="checkbox" id="autoSaveToggle" checked><span class="slider"></span></label>
      </div>
      <div class="setting" style="margin-top:16px;flex-direction:column;gap:6px;">
        <label style="font-size:14px;color:#6d28d9;font-weight:700;">CHEAT CODE</label>
        <input type="text" id="cheatInput" placeholder="Enter cheat code..." style="width:180px;padding:8px 12px;border:2px solid #c4b5fd;border-radius:8px;font-family:'Poppins',sans-serif;font-size:14px;text-align:center;outline:none;background:#fff;">
      </div>
      <button id="btn-resume">RESUME</button>
      <button id="btn-save">SAVE GAME</button>
      <button id="btn-back-menu">BACK TO MENU</button>
    </div>
  </div>

  <div id="save-notice" style="position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:100;background:#166534;color:#fff;padding:10px 24px;border-radius:8px;font-weight:700;font-size:16px;font-family:'Poppins',sans-serif;display:none;pointer-events:none;">Game Saved!</div>

  <div id="death-overlay">
    <div class="death-window">
      <h2>YOU DIED</h2>
      <button id="btn-respawn">RESPAWN</button>
      <button id="btn-death-menu">BACK TO MENU</button>
    </div>
  </div>

  <div id="crate-ui">
    <div class="window">
      <h2>📦 Paper Crate</h2>
      <div class="section"><h3>Crate Inventory</h3><div class="grid" id="crate-grid"></div></div>
      <div class="section"><h3>Your Inventory</h3><div class="grid" id="crate-player-grid"></div></div>
      <button class="close-crate" id="close-crate">Close</button>
    </div>
  </div>

  <div id="move-dialog">
    <div class="md-window">
      <p>How much you want to move?</p>
      <input type="number" id="move-qty" min="1" value="1">
      <p class="md-error" id="move-error"></p>
      <div class="md-buttons">
        <button id="move-confirm">Move</button>
        <button id="move-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="making">
    <div class="window">
      <h2>MAKING</h2>
      <div class="grid" id="recipeGrid"></div>
      <div class="footer">
        <span class="hint" id="selectedHint">Select a recipe</span>
        <button id="makeBtn" disabled>Make</button>
      </div>
      <div class="close-hint">Press <b>E</b> or tap outside to close</div>
    </div>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const d = document.createElement('div');
      d.style = 'position:fixed;inset:0;z-index:999;background:#fff;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto';
      d.textContent = (e.error && e.error.stack) || e.message || String(e);
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const d = document.createElement('div');
      d.style = 'position:fixed;inset:0;z-index:999;background:#fff;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto';
      d.textContent = (e.reason && e.reason.stack) || String(e.reason);
      document.body.appendChild(d);
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:20px;color:#333">Failed to load Three.js</div>';
    }

    const canvas = document.createElement('canvas');
    canvas.width = 2;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0d47a1');
    grad.addColorStop(0.4, '#1976d2');
    grad.addColorStop(0.7, '#4fc3f7');
    grad.addColorStop(1, '#e3f2fd');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);
    const skyTex = new THREE.CanvasTexture(canvas);

    const isMobile = 'ontouchstart' in window;
    const isLoadMode = new URLSearchParams(location.search).get('mode') === 'load';
    if (isLoadMode) {
      try {
        const raw = localStorage.getItem('papercore_save_v1');
        if (raw) {
          const sd = JSON.parse(raw);
          if (sd.worldSize) document.getElementById('wsInput').value = sd.worldSize.join('-');
        }
      } catch(e) {}
      document.getElementById('wsInput').parentElement.style.display = 'none';
    }
    const wsParts = (document.getElementById('wsInput').value || '200-100-200').split('-').map(Number);
    const gridX = Math.max(20, wsParts[0] || 200);
    const gridZ = Math.max(20, wsParts[2] || wsParts[0] || 200);
    const gridY = Math.max(10, wsParts[1] || 100);
    const halfX = gridX / 2, halfZ = gridZ / 2;
    let renderDist = isMobile ? 12 : 20;
    const scene = new THREE.Scene();
    scene.background = skyTex;
    scene.fog = new THREE.Fog(0xdceeff, renderDist * 0.3, renderDist * 1.2);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
    } catch (e) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:20px;color:#333">WebGL not available on this device.</div>';
      throw e;
    }
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1 : 2));
    if (!isMobile) {
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    }
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

      if (nonStackable) qty = 1;

      requestAnimationFrame(animate);
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.05);
      fpsFrames++;
      fpsTime += rawDt;
      if (fpsTime >= 0.5) {
        fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' FPS';
        fpsFrames = 0;
        fpsTime = 0;
      }

      const t0 = performance.now();
      do {
        buildChunkMesh(chunkBuildQueue.shift());
      } while (chunkBuildQueue.length > 0 && performance.now() - t0 < 8);

      if (autoSaveEnabled) {
        autoSaveTimer += dt;
        if (autoSaveTimer >= 30) {
          autoSaveTimer = 0;
          saveGame();
        }
      }

      playerBody.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0));

      if (isPaused || isDead || openCratePos) { renderer.render(scene, camera); return; }

      if (thirdPerson) {
        const dist = 4;
        const offset = new THREE.Vector3(
          dist * Math.sin(yaw) * Math.cos(-pitch),
          dist * Math.sin(-pitch) + 1.5,
          dist * Math.cos(yaw) * Math.cos(-pitch)
        );
        camera.position.copy(playerBody.position).add(offset);
        camera.lookAt(playerBody.position.x, playerBody.position.y + 1, playerBody.position.z);
      } else {
        const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);
        camera.position.copy(playerBody.position);
        camera.position.y += 0.4;
      }

      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      forward.y = 0;
      forward.normalize();
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      right.y = 0;
      right.normalize();

      const moveDir = new THREE.Vector3();
      if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
      if (velX !== 0 || velZ !== 0) {
        moveDir.add(right.clone().multiplyScalar(velX));
        moveDir.add(forward.clone().multiplyScalar(velZ));
      }

      if (moveDir.length() > 0) {
        moveDir.normalize();
        velocity.x = moveDir.x * 5;
        velocity.z = moveDir.z * 5;
      } else {
        velocity.x *= 0.7;
        velocity.z *= 0.7;
      }

      velocity.y -= 20 * dt;

      function blockedInDir(px, py, pz, dx, dz) {
        const hwX = 0.4, hwZ = 0.1, hh = 0.45, eps = 0.001;
        const edgeX = px + dx * hwX;
        const edgeZ = pz + dz * hwZ;
        const bx = Math.floor(edgeX + halfX + (dx > 0 ? eps : (dx < 0 ? -eps : 0)));
        const bz = Math.floor(edgeZ + halfZ + (dz > 0 ? eps : (dz < 0 ? -eps : 0)));
        const minBY = Math.floor(py - hh + eps);
        const maxBY = Math.floor(py + hh - eps);
        for (let by = minBY; by <= maxBY; by++) {
          if (by >= 0 && by < gridY && isSolidBlock(bx, bz, by)) return true;
        }
        return false;
      }

      if (playerCollidesAt(playerBody.position.x, playerBody.position.y, playerBody.position.z, true)) {
        const px = playerBody.position.x, py = playerBody.position.y, pz = playerBody.position.z;
        let pushed = false;
        for (const [dx, dz] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          for (let d = 0.1; d <= 1.5; d += 0.1) {
            const tx = px + dx * d, tz = pz + dz * d;
            if (!playerCollidesAt(tx, py, tz, true)) {
              playerBody.position.x = tx;
              playerBody.position.z = tz;
              pushed = true;
              break;
            }
          }
          if (!playerCollidesAt(playerBody.position.x, playerBody.position.y, playerBody.position.z, true)) { pushed = true; break; }
        }
        if (!pushed) {
          for (let d = 0.1; d <= 2; d += 0.1) {
            if (!playerCollidesAt(playerBody.position.x, py + d, playerBody.position.z, true)) {
              playerBody.position.y = py + d;
              break;
            }
          }
        }
      }

      if (velocity.x !== 0) {
        const nextX = playerBody.position.x + velocity.x * dt;
        const dirX = Math.sign(velocity.x);
        if (!blockedInDir(nextX, playerBody.position.y, playerBody.position.z, dirX, 0)) {
          playerBody.position.x = nextX;
        } else {
          velocity.x = 0;
        }
      }
      if (velocity.z !== 0) {
        const nextZ = playerBody.position.z + velocity.z * dt;
        const dirZ = Math.sign(velocity.z);
        if (!blockedInDir(playerBody.position.x, playerBody.position.y, nextZ, 0, dirZ)) {
          playerBody.position.z = nextZ;
        } else {
          velocity.z = 0;
        }
      }

      playerBody.position.y += velocity.y * dt;
      if (velocity.y > 0) {
        const hy = playerBody.position.y + 0.45, hyB = Math.floor(hy + 0.001);
        const mnX = Math.floor(playerBody.position.x - 0.4 + halfX), mxX = Math.floor(playerBody.position.x + 0.4 + halfX - 0.001);
        const mnZ = Math.floor(playerBody.position.z - 0.05 + halfZ), mxZ = Math.floor(playerBody.position.z + 0.05 + halfZ - 0.001);
        let hit = false;
        for (let bx = mnX; bx <= mxX && !hit; bx++) {
          for (let bz = mnZ; bz <= mxZ && !hit; bz++) {
            if (hyB >= 0 && hyB < gridY && isSolidBlock(bx, bz, hyB)) {
              playerBody.position.y = hyB - 0.45; velocity.y = 0; hit = true;
            }
          }
        }
      }

      const bound = 1000000;
      playerBody.position.x = Math.max(-bound, Math.min(bound, playerBody.position.x));
      playerBody.position.z = Math.max(-bound, Math.min(bound, playerBody.position.z));
    
      const wasOnGround = onGround;
      const bx = Math.floor(playerBody.position.x + halfX);
      const bz = Math.floor(playerBody.position.z + halfZ);
      let groundBlockY = -1;
      const cxc = Math.floor(bx / CHUNK), czc = Math.floor(bz / CHUNK);
      for (let cy = chY - 1; cy >= 0; cy--) {
        const chunk = getChunk(cxc, czc, cy);
        if (!chunk) continue;
        for (let ly = chunk.ny - 1; ly >= 0; ly--) {
          const blockY = chunk.sy + ly;
          const blockTop = blockY + 1;
          if (blockTop > playerBody.position.y) continue;
          const localId = chunkLocalIdx(chunk, bx, bz, blockY);
          if (localId >= 0 && localId < chunk.states.length && chunk.states[localId] !== 0) {
            groundBlockY = blockY;
            break;
          }
        }
        if (groundBlockY >= 0) break;
      }
      if (groundBlockY >= 0) {
        const snapY = groundBlockY + 1 + PH / 2;
        if (playerBody.position.y <= snapY + 0.05 && velocity.y <= 0) {
          playerBody.position.y = snapY;
          velocity.y = 0;
          onGround = true;
        } else {
          onGround = false;
        }
      } else {
        if (playerBody.position.y <= PH / 2 - 0.01) {
          playerBody.position.y = PH / 2 - 0.01;
          velocity.y = 0;
          onGround = true;
        } else {
          onGround = false;
        }
      }

      if (wasOnGround && !onGround) {
        fallStartY = playerBody.position.y;
      } else if (!wasOnGround && onGround) {
        const fallDist = fallStartY - playerBody.position.y;
        if (fallDist >= 5) {
          const dmg = Math.floor(fallDist - 5) + 1;
          playerHealth = Math.max(0, playerHealth - dmg);
          updateHealthDisplay();
          if (playerHealth <= 0) {
            isPaused = true;
            die();
          }
        }
      }

      if (keys['Space'] && onGround) {
        velocity.y = 7;
        onGround = false;
        fallStartY = playerBody.position.y;
      }

      for (let i = scrapItems.length - 1; i >= 0; i--) {
        const s = scrapItems[i];
        const dx = playerBody.position.x - s.pos.x;
        const dz = playerBody.position.z - s.pos.z;
        const dist2 = dx * dx + dz * dz;
        if (dist2 > renderDist * renderDist) {
          s.mesh.visible = false;
          s.pickupTimer = 0;
          continue;
        }
        s.mesh.visible = true;

        if (!s.onGround) {
          const prevY = s.pos.y;
          s.velY -= 20 * dt;
          s.pos.y += s.velY * dt;
          const sbx = Math.floor(s.pos.x + halfX);
          const sbz = Math.floor(s.pos.z + halfZ);
          if (sbx >= 0 && sbz >= 0) {
            let groundY = -1;
            const cxc = Math.floor(sbx / CHUNK), czc = Math.floor(sbz / CHUNK);
            for (let cy = chY - 1; cy >= 0; cy--) {
              const chunk = getChunk(cxc, czc, cy);
              if (!chunk) continue;
              for (let ly = chunk.ny - 1; ly >= 0; ly--) {
                const blockY = chunk.sy + ly;
                const blockTop = blockY + 1;
                if (blockTop > prevY) continue;
                const localId = chunkLocalIdx(chunk, sbx, sbz, blockY);
                if (localId >= 0 && localId < chunk.states.length && chunk.states[localId] !== 0) {
                  groundY = blockY;
                  break;
                }
              }
              if (groundY >= 0) break;
            }
            if (groundY >= 0 && s.pos.y <= groundY + 1 + 0.04) {
              s.pos.y = groundY + 1 + 0.04;
              s.velY = 0;
              s.onGround = true;
            }
          }
          if (s.pos.y < 0.04) {
            s.pos.y = 0.04;
            s.velY = 0;
            s.onGround = true;
          }
          s.mesh.position.y = s.pos.y;
        } else {
          const sbx = Math.floor(s.pos.x + halfX);
          const sbz = Math.floor(s.pos.z + halfZ);
          const belowY = Math.floor(s.pos.y - 0.05);
          if (sbx < 0 || sbz < 0 || belowY < 0 || belowY >= gridY || !isSolidBlock(sbx, sbz, belowY)) {
            s.onGround = false;
            s.velY = 0;
          }
        }

        if (dist2 < 1.5 * 1.5) {
          s.pickupTimer += dt;
          if (s.pickupTimer >= 0.7) {
            s.mesh.visible = false;
            addToInventory(s.itemType || 'scrap');
            scrapItems.splice(i, 1);
          }
        } else {
          s.pickupTimer = 0;
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.vel.y -= 20 * dt;
        const dx = p.vel.x * dt, dy = p.vel.y * dt, dz = p.vel.z * dt;
        p.pos.x += dx; p.pos.y += dy; p.pos.z += dz;
        p.traveled += Math.sqrt(dx*dx+dy*dy+dz*dz);
        p.life -= dt;
        if (p.life <= 0 || p.pos.y < -10) {
          p.mesh.visible = false;
          projectiles.splice(i, 1);
          continue;
        }
        const bx = Math.floor(p.pos.x + halfX);
        const bz = Math.floor(p.pos.z + halfZ);
        const by = Math.floor(p.pos.y);
        if (by >= 0 && by < gridY && isSolidBlock(bx, bz, by)) {
          p.mesh.visible = false;
          projectiles.splice(i, 1);
          continue;
        }
        if (p.source !== 'mob') {
          if (p.traveled > 2) {
            const hx = playerBody.position.x, hy = playerBody.position.y, hz = playerBody.position.z;
            if (Math.abs(p.pos.x - hx) < 0.55 && Math.abs(p.pos.y - hy) < 0.6 && Math.abs(p.pos.z - hz) < 0.2) {
              const dmg = p.type === 'reinforced' ? 5 : 2;
              if (!shieldBlock(dmg)) {
                playerHealth = Math.max(0, playerHealth - dmg);
                updateHealthDisplay();
                if (playerHealth <= 0) { isPaused = true; die(); }
              }
              p.mesh.visible = false;
              projectiles.splice(i, 1);
              continue;
            }
          }
          let hit = false;
          for (let gi = glueys.length - 1; gi >= 0; gi--) {
            const g = glueys[gi];
            if (Math.abs(p.pos.x - g.x) < 0.6 && Math.abs(p.pos.z - g.z) < 0.6 && Math.abs(p.pos.y - g.y) < 1.1) {
              g.hp -= p.type === 'reinforced' ? 5 : 2;
              g.panicTimer = 10;
              if (g.mesh) { g.flashTimer = 0.5; g.mesh.material.color.setHex(0xff0000); }
              p.mesh.visible = false;
              projectiles.splice(i, 1);
              if (g.hp <= 0) {
                if (g.mesh) { g.mesh.material.color.setHex(0xffffff); g.mesh.visible = false; }
                for (let di = 0; di < 2 + Math.floor(Math.random() * 2); di++) {
                  const gm = freePoolMesh(glueDropPool);
                  if (gm) {
                    gm.position.set(g.x + (Math.random()-0.5)*0.6, g.y + 0.5, g.z + (Math.random()-0.5)*0.6);
                    gm.visible = true;
                    scrapItems.push({ mesh: gm, pos: gm.position.clone(), velY: 0, onGround: false, pickupTimer: 0, itemType: 'glue' });
                  }
                }
                const pm = freePoolMesh(plasticDropPool);
                if (pm) { pm.position.set(g.x + (Math.random()-0.5)*0.4, g.y + 0.5, g.z + (Math.random()-0.5)*0.4); pm.visible = true; scrapItems.push({ mesh: pm, pos: pm.position.clone(), velY: 0, onGround: false, pickupTimer: 0, itemType: 'plastic' }); }
                glueys.splice(gi, 1);
              }
              hit = true;
              break;
            }
          }
          if (hit) continue;
          for (let ci = cartolines.length - 1; ci >= 0; ci--) {
            const c = cartolines[ci];
            if (Math.abs(p.pos.x - c.x) < 1.0 && Math.abs(p.pos.z - c.z) < 0.2 && Math.abs(p.pos.y - c.y) < 1.1) {
              c.hp -= p.type === 'reinforced' ? 5 : 2;
              if (c.mesh) { c.flashTimer = 0.5; c.mesh.material.color.setHex(0xff0000); }
              p.mesh.visible = false;
              projectiles.splice(i, 1);
              if (c.hp <= 0) {
                if (c.mesh) { c.mesh.material.color.setHex(0xffffff); c.mesh.visible = false; }
                const scrapCount = 30 + Math.floor(Math.random() * 21);
                for (let di = 0; di < scrapCount; di++) {
                  const sm = freePoolMesh(scrapPool);
                  if (sm) {
                    sm.position.set(c.x + (Math.random()-0.5)*2, c.y + 0.5 + Math.random(), c.z + (Math.random()-0.5)*0.5);
                    sm.visible = true;
                    scrapItems.push({ mesh: sm, pos: sm.position.clone(), velY: 0, onGround: false, pickupTimer: 0, itemType: 'scrap' });
                  }
                }
                const csm = freePoolMesh(cartScrapPool);
                if (csm) {
                  csm.position.set(c.x, c.y + 0.5, c.z);
                  csm.visible = true;
                  scrapItems.push({ mesh: csm, pos: csm.position.clone(), velY: 0, onGround: false, pickupTimer: 0, itemType: 'cartolina' });
                }
                cartolines.splice(ci, 1);
              }
              hit = true;
              break;
            }
          }
          if (hit) continue;
        } else {
          const hx = playerBody.position.x, hy = playerBody.position.y, hz = playerBody.position.z;
          if (Math.abs(p.pos.x - hx) < 0.55 && Math.abs(p.pos.y - hy) < 0.6 && Math.abs(p.pos.z - hz) < 0.2) {
            const dmg = p.type === 'reinforced' ? 5 : 2;
            if (!shieldBlock(dmg)) {
              playerHealth = Math.max(0, playerHealth - dmg);
              updateHealthDisplay();
              if (playerHealth <= 0) { isPaused = true; die(); }
            }
            p.mesh.visible = false;
            projectiles.splice(i, 1);
            continue;
          }
        }
        p.mesh.position.copy(p.pos);
      }
      if (throwCooldown > 0) throwCooldown -= dt;
      if (attachHealTimer >= 0) {
        const sel = inventory[selectedSlot];
        if (!sel || sel.count <= 0 || sel.type !== 'attachable') {
          attachHealTimer = -1;
        } else {
          attachHealTimer += dt;
          if (attachHealTimer >= 1) {
            attachHealTimer = -1;
            playerHealth = Math.min(maxHealth, playerHealth + 2);
            updateHealthDisplay();
            removeItems('attachable', 1);
          }
        }
      }

      // Gluey system
      function glueyCollidesAt(gx, gy, gz) {
        const hwX = 0.25, hwZ = 0.25, hh = 0.75;
        const minBX = Math.floor(gx - hwX + halfX);
        const maxBX = Math.floor(gx + hwX + halfX - 0.001);
        const minBY = Math.floor(gy - hh);
        const maxBY = Math.floor(gy + hh - 0.001);
        const minBZ = Math.floor(gz - hwZ + halfZ);
        const maxBZ = Math.floor(gz + hwZ + halfZ - 0.001);
        for (let bx = minBX; bx <= maxBX; bx++) {
          for (let by = minBY; by <= maxBY; by++) {
            for (let bz = minBZ; bz <= maxBZ; bz++) {
              if (isSolidBlock(bx, bz, by)) return true;
            }
          }
        }
        return false;
      }
      function glueyBlockedInDir(gx, gy, gz, dx, dz) {
        const hwX = 0.25, hwZ = 0.25, hh = 0.75, eps = 0.001;
        const edgeX = gx + dx * hwX;
        const edgeZ = gz + dz * hwZ;
        const bx = Math.floor(edgeX + halfX + (dx > 0 ? eps : (dx < 0 ? -eps : 0)));
        const bz = Math.floor(edgeZ + halfZ + (dz > 0 ? eps : (dz < 0 ? -eps : 0)));
        const minBY = Math.floor(gy - hh + eps);
        const maxBY = Math.floor(gy + hh - eps);
        for (let by = minBY; by <= maxBY; by++) {
          if (by >= 0 && by < gridY && isSolidBlock(bx, bz, by)) return true;
        }
        return false;
      }
      glueySpawnTimer += dt;
      if (currentDim === 'paperia' && glueySpawnTimer > 3 && glueys.length < 15) {
        glueySpawnTimer = 0;
        const freeMesh = glueyMeshes.find(m => !m.visible);
        if (freeMesh) {
          const a = Math.random() * Math.PI * 2;
          const d = 5 + Math.random() * 20;
          const sx = Math.cos(a) * d, sz = Math.sin(a) * d;
          const sy = terrainHeight(Math.floor(sx + halfX), Math.floor(sz + halfZ));
          freeMesh.material.color.setHex(0xffffff);
          freeMesh.position.set(sx, sy + 0.75, sz);
          freeMesh.visible = true;
          glueys.push({ x: sx, y: sy + 0.75, z: sz, vy: 0, onGround: true, moveTimer: Math.random() * 2, dirX: Math.cos(a), dirZ: Math.sin(a), mesh: freeMesh, hp: 5, panicTimer: 0, flashTimer: 0, scatter: 0 });
        }
      }
      for (let gi = 0; gi < glueys.length; gi++) {
        const g = glueys[gi];
        const gdx = playerBody.position.x - g.x, gdz = playerBody.position.z - g.z;
        if (gdx * gdx + gdz * gdz > 900) {
          if (g.mesh) { g.mesh.material.color.setHex(0xffffff); g.mesh.visible = false; }
          glueys.splice(gi, 1); gi--;
          continue;
        }
        if (g.flashTimer > 0) {
          g.flashTimer -= dt;
          if (g.flashTimer <= 0) { g.flashTimer = 0; if (g.mesh) g.mesh.material.color.setHex(0xffffff); }
        }
        if (g.panicTimer > 0) g.panicTimer -= dt;
        const speedMul = g.panicTimer > 0 ? 3 : 1;
        const jumpChance = g.panicTimer > 0 ? 6 : 1.5;
        g.moveTimer -= dt * speedMul;
        if (g.moveTimer <= 0) {
          g.moveTimer = 1 + Math.random() * 2;
          g.scatter = (Math.random() - 0.5) * Math.PI * 0.5;
          const a2 = Math.random() * Math.PI * 2;
          g.dirX = Math.cos(a2);
          g.dirZ = Math.sin(a2);
        }
        const held = inventory[selectedSlot];
        if (held && held.type === 'glue' && held.count > 0) {
          const dx = playerBody.position.x - g.x, dz = playerBody.position.z - g.z;
          const d = Math.sqrt(dx * dx + dz * dz) || 1;
          const angle = Math.atan2(dz, dx) + g.scatter;
          g.dirX = Math.cos(angle);
          g.dirZ = Math.sin(angle);
        }
        if (g.onGround && Math.random() < jumpChance * dt) {
          g.vy = 7;
          g.onGround = false;
        }
        g.vy -= 20 * dt;
        const gNextX = g.x + g.dirX * 2.5 * speedMul * dt;
        if (!glueyBlockedInDir(gNextX, g.y, g.z, Math.sign(g.dirX), 0)) {
          g.x = gNextX;
        } else {
          g.dirX = 0;
          g.moveTimer = 0;
        }
        const gNextZ = g.z + g.dirZ * 2.5 * speedMul * dt;
        if (!glueyBlockedInDir(g.x, g.y, gNextZ, 0, Math.sign(g.dirZ))) {
          g.z = gNextZ;
        } else {
          g.dirZ = 0;
          g.moveTimer = 0;
        }
        g.y += g.vy * dt;
        const gbx = Math.floor(g.x + halfX);
        const gbz = Math.floor(g.z + halfZ);
        if (g.vy <= 0 && gbx >= 0 && gbz >= 0) {
          let groundY = -1;
          const cxc = Math.floor(gbx / CHUNK), czc = Math.floor(gbz / CHUNK);
          for (let cy = chY - 1; cy >= 0; cy--) {
            const chunk = getChunk(cxc, czc, cy);
            if (!chunk) continue;
            for (let ly = chunk.ny - 1; ly >= 0; ly--) {
              const blockY = chunk.sy + ly;
              if (blockY + 1 > g.y) continue;
              const localId = chunkLocalIdx(chunk, gbx, gbz, blockY);
              if (localId >= 0 && localId < chunk.states.length && chunk.states[localId] !== 0) {
                groundY = blockY;
                break;
              }
            }
            if (groundY >= 0) break;
          }
          if (groundY >= 0) {
            const snapY = groundY + 1 + 0.75;
            if (g.y <= snapY + 0.05) {
              g.y = snapY;
              g.vy = 0;
              g.onGround = true;
            }
          }
        }
        if (g.y < 0.75) {
          g.y = 0.75; g.vy = 0; g.onGround = true;
        }
        if (g.mesh) {
          g.mesh.position.set(g.x, g.y, g.z);
          g.mesh.rotation.y = Math.atan2(g.dirX || 0.001, g.dirZ || 0);
          const gdx = playerBody.position.x - g.x;
          const gdz = playerBody.position.z - g.z;
          g.mesh.visible = gdx * gdx + gdz * gdz < renderDist * renderDist;
        }
      }

      // Cartoline system
      cartolineSpawnTimer += dt;
      if (currentDim === 'paperia' && cartolineSpawnTimer > 5 && cartolines.length < 5) {
        cartolineSpawnTimer = 0;
        const freeMesh = cartolineMeshes.find(m => !m.visible);
        if (freeMesh) {
          const a = Math.random() * Math.PI * 2;
          const d = 10 + Math.random() * 30;
          const sx = playerBody.position.x + Math.cos(a) * d, sz = playerBody.position.z + Math.sin(a) * d;
          const sy = terrainHeight(Math.floor(sx + halfX), Math.floor(sz + halfZ));
          freeMesh.material.color.setHex(0xffffff);
          freeMesh.position.set(sx, sy + 0.9, sz);
          freeMesh.visible = true;
          cartolines.push({ x: sx, y: sy + 0.9, z: sz, vy: 0, onGround: true, moveTimer: Math.random() * 2, dirX: Math.cos(a), dirZ: Math.sin(a), mesh: freeMesh, hp: 20, throwCooldown: Math.random() * 3, flashTimer: 0 });
        }
      }
      for (let ci = 0; ci < cartolines.length; ci++) {
        const c = cartolines[ci];
        const cdx = playerBody.position.x - c.x, cdz = playerBody.position.z - c.z;
        const cdist2 = cdx * cdx + cdz * cdz;
        if (cdist2 > 1600) {
          if (c.mesh) { c.mesh.material.color.setHex(0xffffff); c.mesh.visible = false; }
          cartolines.splice(ci, 1); ci--;
          continue;
        }
        c.throwCooldown -= dt;
        if (c.flashTimer > 0) {
          c.flashTimer -= dt;
          if (c.flashTimer <= 0) { c.flashTimer = 0; if (c.mesh) c.mesh.material.color.setHex(0xffffff); }
        }
        c.moveTimer -= dt;
        if (c.moveTimer <= 0) {
          c.moveTimer = 1 + Math.random() * 2;
          const angleToPlayer = Math.atan2(cdz, cdx);
          const scatter = (Math.random() - 0.5) * Math.PI * 0.5;
          const finalAngle = angleToPlayer + scatter;
          c.dirX = Math.cos(finalAngle);
          c.dirZ = Math.sin(finalAngle);
        }
        if (c.onGround && Math.random() < 1.5 * dt) {
          c.vy = 7;
          c.onGround = false;
        }
        c.vy -= 20 * dt;
        const cHwX = 0.5, cHwZ = 0.5, cHh = 0.9, eps = 0.001;
        const cNextX = c.x + c.dirX * 2.5 * dt;
        const cEdgeX = cNextX + Math.sign(c.dirX) * cHwX;
        const cbx = Math.floor(cEdgeX + halfX + (c.dirX > 0 ? eps : (c.dirX < 0 ? -eps : 0)));
        const cminBY = Math.floor(c.y - cHh + eps);
        const cmaxBY = Math.floor(c.y + cHh - eps);
        let blockedX = false;
        if (c.dirX !== 0) {
          for (let by = cminBY; by <= cmaxBY; by++) {
            if (by >= 0 && by < gridY && isSolidBlock(cbx, Math.floor(c.z + halfZ + (c.dirX > 0 ? cHwZ : -cHwZ)), by)) { blockedX = true; break; }
          }
        }
        if (!blockedX) {
          c.x = cNextX;
        } else {
          c.dirX = 0;
          c.moveTimer = 0;
        }
        const cNextZ = c.z + c.dirZ * 2.5 * dt;
        const cEdgeZ = cNextZ + Math.sign(c.dirZ) * cHwZ;
        const cbz = Math.floor(cEdgeZ + halfZ + (c.dirZ > 0 ? eps : (c.dirZ < 0 ? -eps : 0)));
        let blockedZ = false;
        if (c.dirZ !== 0) {
          for (let by = cminBY; by <= cmaxBY; by++) {
            if (by >= 0 && by < gridY && isSolidBlock(Math.floor(c.x + halfX + (c.dirZ > 0 ? cHwX : -cHwX)), cbz, by)) { blockedZ = true; break; }
          }
        }
        if (!blockedZ) {
          c.z = cNextZ;
        } else {
          c.dirZ = 0;
          c.moveTimer = 0;
        }
        c.y += c.vy * dt;
        const cbx2 = Math.floor(c.x + halfX);
        const cbz2 = Math.floor(c.z + halfZ);
        if (c.vy <= 0 && cbx2 >= 0 && cbz2 >= 0) {
          let cGroundY = -1;
          const cxc = Math.floor(cbx2 / CHUNK), czc = Math.floor(cbz2 / CHUNK);
          for (let cy = chY - 1; cy >= 0; cy--) {
            const chunk = getChunk(cxc, czc, cy);
            if (!chunk) continue;
            for (let ly = chunk.ny - 1; ly >= 0; ly--) {
              const blockY = chunk.sy + ly;
              if (blockY + 1 > c.y) continue;
              const localId = chunkLocalIdx(chunk, cbx2, cbz2, blockY);
              if (localId >= 0 && localId < chunk.states.length && chunk.states[localId] !== 0) {
                cGroundY = blockY;
                break;
              }
            }
            if (cGroundY >= 0) break;
          }
          if (cGroundY >= 0) {
            const snapY = cGroundY + 1 + cHh;
            if (c.y <= snapY + 0.05) {
              c.y = snapY;
              c.vy = 0;
              c.onGround = true;
            }
          }
        }
        if (c.y < cHh) {
          c.y = cHh; c.vy = 0; c.onGround = true;
        }
        if (c.mesh) {
          c.mesh.position.set(c.x, c.y, c.z);
          c.mesh.rotation.y = Math.atan2(c.dirX || 0.001, c.dirZ || 0);
          c.mesh.visible = cdist2 < renderDist * renderDist;
        }
        if (c.throwCooldown <= 0 && cdist2 < 25 * 25) {
          c.throwCooldown = 3 + Math.random() * 2;
          const cm = freePoolMesh(thrownPool);
          if (cm) {
            const isReinf = Math.random() < 0.2;
            const cSpeed = isReinf ? 25 : 15;
            const cDir = new THREE.Vector3(cdx, 0, cdz).normalize();
            cDir.y = -0.1;
            cDir.normalize();
            cm.material = isReinf ? reinforcedBallMat : paperBallMat;
            cm.position.set(c.x, c.y + 0.5, c.z);
            cm.visible = true;
            projectiles.push({ mesh: cm, vel: cDir.multiplyScalar(cSpeed), pos: cm.position.clone(), life: 3, type: isReinf ? 'reinforced' : 'paper_ball', traveled: 0, source: 'mob' });
          }
        }
      }

      if (isBreaking) {
        if (breakNeedsTarget) {
          breakNeedsTarget = false;
          raycaster.setFromCamera({ x: 0, y: 0 }, camera);
          const hits = raycaster.intersectObjects(visibleMeshes);
          if (hits.length) {
            const hitObj = hits[0].object;
            let chunk = null;
      for (const c of loadedChunks.values()) { if (c.mesh === hitObj || c.waterMesh === hitObj || c.woodMesh === hitObj || c.reinfMesh === hitObj || c.ashMesh === hitObj || c.vinuMesh === hitObj || c.crateMesh === hitObj) { chunk = c; break; } }
            if (chunk) {
              const hid = hits[0].instanceId;
              if (chunk.states[hid] === 1 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 1;
                breakMesh = chunk.mesh;
              } else if (chunk.states[hid] === 2 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 2;
                breakMesh = chunk.waterMesh;
              } else if (chunk.states[hid] === 3 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 25;
                breakMesh = chunk.woodMesh;
              } else if (chunk.states[hid] === 4 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 7;
                breakMesh = chunk.reinfMesh;
              } else if (chunk.states[hid] === 5 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 10;
                breakMesh = null;
                const bp = idxToWorldPos(chunk, hid);
                const found = beacons.find(b => b.bx === Math.round(bp.x + halfX - 0.5) && b.by === Math.round(bp.y - 0.5) && b.bz === Math.round(bp.z + halfZ - 0.5));
                breakBeaconBase = found ? found.baseMesh : null;
              } else if (chunk.states[hid] === 6 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 0.5;
                breakMesh = chunk.ashMesh;
              } else if (chunk.states[hid] === 7 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 0.5;
                breakMesh = chunk.vinuMesh;
              } else if (chunk.states[hid] === 8 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
                breakDuration = 1.5;
                breakMesh = chunk.crateMesh;
              }
            } else {
              const beaconHit = beacons.find(b => b.baseMesh === hitObj);
              if (beaconHit) {
                const cxc = Math.floor(beaconHit.bx / CHUNK), czc = Math.floor(beaconHit.bz / CHUNK), cyc = Math.floor(beaconHit.by / CHUNK);
                const hitChunk = ensureChunkSync(cxc, czc, cyc);
                const hid = chunkLocalIdx(hitChunk, beaconHit.bx, beaconHit.bz, beaconHit.by);
                if (hitChunk.states[hid] === 5 && Math.sqrt((playerBody.position.x-beaconHit.bx+halfX-0.5)**2+(playerBody.position.y-beaconHit.by-0.5)**2+(playerBody.position.z-beaconHit.bz+halfZ-0.5)**2) <= 5) {
                  breakChunk = hitChunk;
                  breakId = hid;
                  breakProgress = 0;
                  breakDuration = 10;
                  breakMesh = null;
                  breakBeaconBase = beaconHit.baseMesh;
                }
              } else if (portalBeacon && portalBeacon.baseMesh === hitObj) {
                breakingPortalBeacon = true;
                breakChunk = null; breakId = -1;
                breakProgress = 0;
                breakDuration = 10;
                breakMesh = null;
              }
            }
          }
        }
        if (breakChunk && breakId >= 0) {
          if (distToBlock(breakChunk, breakId) > 5) {
            resetBreak();
            breakNeedsTarget = true;
          } else {
            breakProgress += dt;
            const t = Math.min(breakProgress / breakDuration, 1);
            const color = new THREE.Color().lerpColors(white, black, t);
            if (breakBeaconBase) {
              breakBeaconBase.material.color.copy(color);
            } else {
              const targetMesh = breakMesh || breakChunk.mesh;
              targetMesh.setColorAt(breakId, color);
              targetMesh.instanceColor.needsUpdate = true;
            }
            if (breakProgress >= breakDuration) {
              breakBlock(breakChunk, breakId);
              breakChunk = null; breakId = -1; breakProgress = 0;
              breakMesh = null;
              breakBeaconBase = null;
              breakNeedsTarget = true;
            }
          }
        } else if (breakingPortalBeacon) {
          if (portalBeacon && Math.sqrt((playerBody.position.x-portalBeacon.x)**2+(playerBody.position.y-portalBeacon.y)**2+(playerBody.position.z-portalBeacon.z)**2) > 5) {
            resetBreak();
            breakNeedsTarget = true;
          } else {
            breakProgress += dt;
            if (breakProgress >= breakDuration) {
              if (portalBeacon) {
                portalBeacon.baseMesh.visible = false;
                portalBeacon.beamMesh.visible = false;
                const mesh = freePoolMesh(beaconDropPool);
                if (mesh) {
                  mesh.position.set(portalBeacon.x, portalBeacon.y + 0.5, portalBeacon.z);
                  mesh.visible = true;
                  scrapItems.push({ mesh, pos: mesh.position.clone(), velY: 0, onGround: false, pickupTimer: 0, itemType: 'beacon' });
                }
                portalBeacon = null;
              }
              breakingPortalBeacon = false;
              breakChunk = null; breakId = -1; breakProgress = 0;
              breakMesh = null;
              breakNeedsTarget = true;
            }
          }
        }
      }
      for (const b of beacons) {
        b.angle += dt * 0.8;
        b.beamMesh.rotation.y = b.angle;
      }
      {
        const pp = playerBody.position;
        if (currentDim === 'paperia') {
          for (const b of beacons) {
            if (Math.abs(pp.x - b.x) < 0.5 && Math.abs(pp.z - b.z) < 0.5 && pp.y >= b.y && pp.y < b.y + 1000) {
              switchDimension(); break;
            }
          }
        } else if (currentDim === 'vinu') {
          if (portalBeacon && Math.abs(pp.x - portalBeacon.x) < 0.5 && Math.abs(pp.z - portalBeacon.z) < 0.5 && pp.y >= portalBeacon.y && pp.y < portalBeacon.y + 1000) {
            switchDimension();
          }
          for (const b of beacons) {
            if (Math.abs(pp.x - b.x) < 0.5 && Math.abs(pp.z - b.z) < 0.5 && pp.y >= b.y && pp.y < b.y + 1000) {
              switchDimension(); break;
            }
          }
        }
      }

      if ((fpsFrames % 10) === 0) {
        const pCX = Math.floor((playerBody.position.x + halfX) / CHUNK);
        const pCZ = Math.floor((playerBody.position.z + halfZ) / CHUNK);
        const pCY = Math.floor(playerBody.position.y / CHUNK);
        const loadR = Math.ceil(renderDist / CHUNK) + 1;
        const unloadR = loadR + 2;
        for (let cx = pCX - loadR; cx <= pCX + loadR; cx++) {
          for (let cz = pCZ - loadR; cz <= pCZ + loadR; cz++) {
            for (let cy = Math.max(0, pCY - 1); cy <= Math.min(chY - 1, pCY + 1); cy++) {
              if (cx >= 0 && cz >= 0 && cy >= 0 && cy < chY) ensureChunk(cx, cz, cy);
            }
          }
        }
        for (const [key, c] of loadedChunks) {
          const parts = key.split(',');
          const cx = parseInt(parts[0]), cz = parseInt(parts[1]), cy = parseInt(parts[2]);
          if (Math.abs(cx - pCX) > unloadR || Math.abs(cz - pCZ) > unloadR || Math.abs(cy - pCY) > 2) {
            if (c.mesh) scene.remove(c.mesh);
            if (c.waterMesh) scene.remove(c.waterMesh);
            loadedChunks.delete(key);
          }
        }
        visibleMeshes.length = 0;
        const rd2c = (renderDist + CHUNK) * (renderDist + CHUNK);
        for (const c of loadedChunks.values()) {
          if (!c.mesh) continue;
          const dx = c.center.x - playerBody.position.x;
          const dy = c.center.y - playerBody.position.y;
          const dz = c.center.z - playerBody.position.z;
          const far = dx * dx + dy * dy + dz * dz > rd2c;
          c.isFar = far;
          c.mesh.visible = !far;
          if (c.waterMesh) c.waterMesh.visible = !far;
          if (c.woodMesh) c.woodMesh.visible = !far;
          if (c.reinfMesh) c.reinfMesh.visible = !far;
          if (c.ashMesh) c.ashMesh.visible = !far;
          if (c.vinuMesh) c.vinuMesh.visible = !far;
          if (c.crateMesh) c.crateMesh.visible = !far;
          if (!far) {
            visibleMeshes.push(c.mesh);
            if (c.waterMesh) visibleMeshes.push(c.waterMesh);
            if (c.woodMesh) visibleMeshes.push(c.woodMesh);
            if (c.reinfMesh) visibleMeshes.push(c.reinfMesh);
            if (c.ashMesh) visibleMeshes.push(c.ashMesh);
            if (c.vinuMesh) visibleMeshes.push(c.vinuMesh);
            if (c.crateMesh) visibleMeshes.push(c.crateMesh);
          }
        }
        for (const b of beacons) { visibleMeshes.push(b.baseMesh); }
        if (portalBeacon) visibleMeshes.push(portalBeacon.baseMesh);
      }

      dir.target.position.copy(playerBody.position);
      dir.target.updateMatrixWorld();

      renderer.render(scene, camera);
    }

    if (new URLSearchParams(location.search).get('mode') === 'load') {
      loadGame();
    }

    animate();
  </script>
</body>
