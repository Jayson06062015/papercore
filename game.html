<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Papercore 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { margin:0; overflow:hidden; font-family:"Poppins",sans-serif; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    canvas { display:block; }
    #blocker { position:fixed; inset:0; background:linear-gradient(135deg,#e0e0e0,#ffffff); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:10; }
    #blocker h1 { font-size:48px; font-weight:900; text-shadow:2px 2px 0 #000; letter-spacing:4px; margin-bottom:30px; }
    #playBtn { padding:15px 40px; font-size:22px; font-weight:700; border:3px solid black; background:white; cursor:pointer; box-shadow:4px 4px 0 black; transition:0.15s; font-family:"Poppins",sans-serif; color:#000; }
    #playBtn:hover { background:#eee; transform:translate(-2px,-2px); box-shadow:6px 6px 0 black; }
    #playBtn:active { transform:translate(0,0); box-shadow:4px 4px 0 black; }
    .setting { margin-top:20px; display:flex; align-items:center; gap:12px; font-size:16px; font-weight:400; color:#333; }
    .setting input { width:140px; accent-color:#8b5cf6; }
    .setting input[type="range"] { -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:linear-gradient(90deg,#c4b5fd,#8b5cf6); outline:none; cursor:pointer; }
    .setting input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#6d28d9; border:2px solid #ddd6fe; cursor:pointer; box-shadow:0 0 4px rgba(0,0,0,0.3); }
    .setting input[type="range"]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#6d28d9; border:2px solid #ddd6fe; cursor:pointer; }
    #fps { position:fixed; top:10px; right:10px; color:#fff; font-size:15px; font-weight:700; pointer-events:none; z-index:5; text-shadow:0 0 4px rgba(0,0,0,0.7); display:none; user-select:none; font-family:"Poppins",sans-serif; }
    #crosshair { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:28px; font-weight:700; pointer-events:none; z-index:5; text-shadow:0 0 3px rgba(0,0,0,0.6); display:none; user-select:none; }
    #inventory { position:fixed; bottom:15px; left:50%; transform:translateX(-50%); display:none; gap:6px; z-index:20; }
    #crafting { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:30; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); }
    #crafting .window { background:linear-gradient(135deg,#f5f3ff,#e0e7ff); border:3px solid #8b5cf6; border-radius:16px; padding:24px; min-width:340px; box-shadow:0 0 40px rgba(139,92,246,0.3); }
    #crafting h2 { margin:0 0 16px; font-size:24px; color:#4c1d95; text-align:center; font-weight:900; }
    #crafting .grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    #crafting .card { width:90px; padding:10px 6px; background:rgba(255,255,255,0.7); border:2px solid #ddd6fe; border-radius:10px; cursor:pointer; text-align:center; transition:0.15s; box-sizing:border-box; }
    #crafting .card:hover { border-color:#8b5cf6; }
    #crafting .card.selected { border-color:#6d28d9; background:#ede9fe; box-shadow:0 0 8px rgba(109,40,217,0.25); }
    #crafting .card img { width:36px; height:36px; object-fit:contain; display:block; margin:0 auto 4px; }
    #crafting .card .name { font-size:11px; font-weight:700; color:#4c1d95; }
    #crafting .card .cost { font-size:10px; color:#6b7280; margin-top:2px; }
    #crafting .card .cost img { width:12px; height:12px; display:inline; vertical-align:middle; margin:0 1px; }
    #crafting .footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid #ddd6fe; }
    #crafting .footer .hint { font-size:12px; color:#6b7280; }
    #crafting .footer button { padding:10px 28px; font-size:15px; font-weight:700; border:2px solid #6d28d9; background:#8b5cf6; color:#fff; border-radius:8px; cursor:pointer; font-family:"Poppins",sans-serif; transition:0.15s; }
    #crafting .footer button:hover { background:#7c3aed; transform:translateY(-1px); }
    #crafting .footer button:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    #crafting .close-hint { text-align:center; color:#6b7280; font-size:12px; margin-top:10px; }
    .slot { width:50px; height:50px; border:2px solid #555; background:rgba(200,200,200,0.6); border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative; backdrop-filter:blur(2px); }
    .slot.selected { border-color:#fff; background:rgba(255,255,255,0.8); }
    .item-img { width:36px; height:36px; object-fit:contain; }
    .count { position:absolute; bottom:1px; right:4px; font-size:13px; font-weight:700; color:#222; text-shadow:0 0 3px #fff; }
    #mobile-controls { position:fixed; inset:0; z-index:15; display:none; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    #joystick-zone { position:absolute; left:14px; bottom:22px; width:100px; height:100px; }
    #joystick-base { width:100%; height:100%; border-radius:50%; background:rgba(255,255,255,0.2); border:2px solid rgba(255,255,255,0.4); position:relative; }
    #joystick-knob { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.6); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
    #touch-look { position:absolute; inset:0; z-index:-1; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .mb { position:absolute; padding:8px 12px; font-size:12px; font-weight:700; border:2px solid rgba(255,255,255,0.4); border-radius:10px; background:rgba(255,255,255,0.2); color:#fff; font-family:"Poppins",sans-serif; user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .mb:active { background:rgba(255,255,255,0.45); }
    #btn-jump { right:18px; bottom:70px; border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center; font-size:14px; }
    #btn-craft { right:18px; top:60px; }
    #btn-break, #btn-place { display:none; }
  </style>
</head>
<body>
  <div id="blocker">
    <h1>PAPERCORE 3D</h1>
    <button id="playBtn">PLAY</button>
    <div class="setting">
      <label for="rdSlider">Render Distance:</label>
      <input type="range" id="rdSlider" min="8" max="60" value="20" step="1">
      <span id="rdValue">20</span>
    </div>
  </div>

  <div id="crosshair">+</div>
  <div id="fps">0 FPS</div>

  <div id="inventory">
    <div class="slot" id="slot1"></div>
    <div class="slot" id="slot2"></div>
    <div class="slot" id="slot3"></div>
    <div class="slot" id="slot4"></div>
    <div class="slot" id="slot5"></div>
    <div class="slot" id="slot6"></div>
    <div class="slot" id="slot7"></div>
    <div class="slot" id="slot8"></div>
  </div>

  <div id="mobile-controls">
    <div id="touch-look"></div>
    <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
    <button class="mb" id="btn-jump">JUMP</button>
    <button class="mb" id="btn-break" style="display:none">BREAK</button>
    <button class="mb" id="btn-place" style="display:none">PLACE</button>
    <button class="mb" id="btn-craft">CRAFT</button>
  </div>

  <div id="crafting">
    <div class="window">
      <h2>MAKING</h2>
      <div class="grid" id="recipeGrid"></div>
      <div class="footer">
        <span class="hint" id="selectedHint">Select a recipe</span>
        <button id="craftBtn" disabled>Make</button>
      </div>
      <div class="close-hint">Press <b>E</b> or tap outside to close</div>
    </div>
  </div>

  <script>
    window.addEventListener('error', (e) => {
      const d = document.createElement('div');
      d.style = 'position:fixed;inset:0;z-index:999;background:#fff;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto';
      d.textContent = (e.error && e.error.stack) || e.message || String(e);
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', (e) => {
      const d = document.createElement('div');
      d.style = 'position:fixed;inset:0;z-index:999;background:#fff;padding:20px;font-family:monospace;font-size:14px;white-space:pre-wrap;overflow:auto';
      d.textContent = (e.reason && e.reason.stack) || String(e.reason);
      document.body.appendChild(d);
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:20px;color:#333">Failed to load Three.js</div>';
    }

    const canvas = document.createElement('canvas');
    canvas.width = 2;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#0d47a1');
    grad.addColorStop(0.4, '#1976d2');
    grad.addColorStop(0.7, '#4fc3f7');
    grad.addColorStop(1, '#e3f2fd');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);
    const skyTex = new THREE.CanvasTexture(canvas);

    const isMobile = 'ontouchstart' in window;
    const gridX = isMobile ? 80 : 600, gridZ = isMobile ? 80 : 600, gridY = 100;
    const halfX = gridX / 2, halfZ = gridZ / 2;
    let renderDist = isMobile ? 12 : 20;
    const scene = new THREE.Scene();
    scene.background = skyTex;
    scene.fog = new THREE.Fog(0xdceeff, renderDist * 0.3, renderDist * 1.2);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 500);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
    } catch (e) {
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;font-size:20px;color:#333">WebGL not available on this device.</div>';
      throw e;
    }
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1 : 2));
    if (!isMobile) {
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    }
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(15, 30, 15);
    dir.castShadow = true;
    dir.shadow.bias = -0.002;
    dir.shadow.mapSize.set(4096, 4096);
    dir.shadow.camera.near = 0.5;
    dir.shadow.camera.far = 300;
    dir.shadow.camera.left = -150;
    dir.shadow.camera.right = 150;
    dir.shadow.camera.top = 150;
    dir.shadow.camera.bottom = -150;
    scene.add(dir);
    scene.add(dir.target);
    const fill = new THREE.DirectionalLight(0xffffff, 0.3);
    fill.position.set(-10, 15, -10);
    scene.add(fill);

    const floorGeo = new THREE.PlaneGeometry(gridX + 20, gridZ + 20);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.0 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    const terrainOctaves = [];
    for (let i = 0; i < 10; i++) {
      terrainOctaves.push({
        f: Math.random() * 0.08 + 0.01,
        g: Math.random() * 0.08 - 0.04,
        p: Math.random() * Math.PI * 2,
        a: Math.random() * 3.5 + 0.8,
      });
    }

    function terrainHeight(x, z) {
      let n = 0;
      for (const o of terrainOctaves) {
        n += Math.sin(x * o.f + z * o.g + o.p) * o.a;
      }
      return Math.max(1, Math.round(30 + n));
    }

    const blockTex = new THREE.TextureLoader().load('./Paper Block.png');
    blockTex.encoding = THREE.sRGBEncoding;
    const blockMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: blockTex, roughness: 0.8 });
    const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
    const mx = new THREE.Matrix4();
    const scaleDummy = new THREE.Object3D();
    const CHUNK = 10;
    const chX = Math.ceil(gridX / CHUNK), chZ = Math.ceil(gridZ / CHUNK), chY = Math.ceil(gridY / CHUNK);
    const chunks = new Array(chX * chZ * chY).fill(null);
    const allChunkMeshes = [];
    for (let cx = 0; cx < chX; cx++) {
      for (let cz = 0; cz < chZ; cz++) {
        for (let cy = 0; cy < chY; cy++) {
          const sx = cx * CHUNK, sz = cz * CHUNK, sy = cy * CHUNK;
          const ex = Math.min(sx + CHUNK, gridX), ez = Math.min(sz + CHUNK, gridZ), ey = Math.min(sy + CHUNK, gridY);
          const nx = ex - sx, nz = ez - sz, ny = ey - sy;
          let hasSolid = false;
          for (let x = sx; x < ex && !hasSolid; x++) {
            for (let z = sz; z < ez && !hasSolid; z++) {
              if (terrainHeight(x, z) > sy) { hasSolid = true; }
            }
          }
          if (!hasSolid) continue;
          const count = nx * nz * ny;
          const mesh = new THREE.InstancedMesh(cubeGeo, blockMat, count);
          mesh.receiveShadow = true; mesh.castShadow = true;
          const states = new Uint8Array(count);
          let i = 0;
          for (let x = sx; x < ex; x++) {
            for (let z = sz; z < ez; z++) {
              const h = terrainHeight(x, z);
              for (let y = sy; y < ey; y++) {
                const wx = x - halfX + 0.5, wz = z - halfZ + 0.5, wy = y + 0.5;
                if (y >= h) {
                  states[i] = 1;
                  scaleDummy.scale.set(0, 0, 0);
                  scaleDummy.position.set(wx, wy, wz);
                  scaleDummy.updateMatrix();
                  mesh.setMatrixAt(i, scaleDummy.matrix);
                } else {
                  mx.identity().setPosition(wx, wy, wz);
                  mesh.setMatrixAt(i, mx);
                }
                i++;
              }
            }
          }
          mesh.instanceMatrix.needsUpdate = true;
          const colArr = new Float32Array(count * 3);
          for (let ci = 0; ci < count; ci++) { colArr[ci * 3] = 1; colArr[ci * 3 + 1] = 1; colArr[ci * 3 + 2] = 1; }
          mesh.instanceColor = new THREE.InstancedBufferAttribute(colArr, 3);
          scene.add(mesh);
          allChunkMeshes.push(mesh);
          const cIdx = ((cx * chZ + cz) * chY) + cy;
          chunks[cIdx] = {
            mesh, states, nx, ny, nz, sx, sy, sz,
            center: new THREE.Vector3(
              (sx + ex - 1) / 2 - halfX + 0.5,
              (sy + ey - 1) / 2 + 0.5,
              (sz + ez - 1) / 2 - halfZ + 0.5
            ),
            isFar: false
          };
        }
      }
    }
    function getChunk(cx, cz, cy) { return chunks[((cx * chZ + cz) * chY) + cy]; }
    function chunkLocalIdx(c, bx, bz, by) {
      return ((bx - c.sx) * c.nz + (bz - c.sz)) * c.ny + (by - c.sy);
    }
    function idxToWorldPos(c, idx) {
      const t1 = Math.floor(idx / (c.nz * c.ny));
      const t2 = idx % (c.nz * c.ny);
      const t3 = Math.floor(t2 / c.ny);
      const t4 = t2 % c.ny;
      return { x: (c.sx + t1) - halfX + 0.5, z: (c.sz + t3) - halfZ + 0.5, y: (c.sy + t4) + 0.5 };
    }
    const PH = 0.9;
    const playerTex = new THREE.TextureLoader().load('./Papey.png');
    const playerBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, PH, 0.1),
      new THREE.MeshStandardMaterial({ map: playerTex, transparent: true, roughness: 0.6 })
    );
    const startBY = terrainHeight(Math.floor(gridX / 2), Math.floor(gridZ / 2));
    playerBody.position.set(0, startBY + PH / 2 + 1, 0);
    playerBody.castShadow = true;
    playerBody.visible = false;
    scene.add(playerBody);

    const raycaster = new THREE.Raycaster();
    const scrapItems = [];
    const scrapTex = new THREE.TextureLoader().load('./Paper Scrap.png');
    const scrapMat = new THREE.MeshStandardMaterial({ map: scrapTex, transparent: true });
    const scrapGeo = new THREE.BoxGeometry(0.3, 0.08, 0.3);
    const scrapDummy = new THREE.Object3D();

    function isSolidBlock(bx, bz, by) {
      if (bx < 0 || bx >= gridX || bz < 0 || bz >= gridZ || by < 0 || by >= gridY) return false;
      const cxc = Math.floor(bx / CHUNK), czc = Math.floor(bz / CHUNK), cyc = Math.floor(by / CHUNK);
      const ch = getChunk(cxc, czc, cyc);
      if (!ch) return false;
      const id = chunkLocalIdx(ch, bx, bz, by);
      return id >= 0 && id < ch.states.length && ch.states[id] === 0;
    }

    function playerCollidesAt(px, py, pz) {
      const hwX = 0.4, hwZ = 0.05, hh = 0.45;
      const minBX = Math.floor(px - hwX + halfX);
      const maxBX = Math.floor(px + hwX + halfX - 0.001);
      const minBY = Math.floor(py - hh);
      const maxBY = Math.floor(py + hh - 0.001);
      const minBZ = Math.floor(pz - hwZ + halfZ);
      const maxBZ = Math.floor(pz + hwZ + halfZ - 0.001);
      for (let bx = minBX; bx <= maxBX; bx++) {
        for (let by = minBY; by <= maxBY; by++) {
          for (let bz = minBZ; bz <= maxBZ; bz++) {
            if (isSolidBlock(bx, bz, by)) return true;
          }
        }
      }
      return false;
    }

    function breakBlock(chunk, localId) {
      const bp = idxToWorldPos(chunk, localId);
      chunk.states[localId] = 1;
      chunk.mesh.setColorAt(localId, white);
      chunk.mesh.instanceColor.needsUpdate = true;
      scrapDummy.scale.set(0, 0, 0);
      scrapDummy.position.set(bp.x, bp.y, bp.z);
      scrapDummy.updateMatrix();
      chunk.mesh.setMatrixAt(localId, scrapDummy.matrix);
      chunk.mesh.instanceMatrix.needsUpdate = true;

      const scrapCount = 5 + Math.floor(Math.random() * 3);
      for (let s = 0; s < scrapCount; s++) {
        const mesh = new THREE.Mesh(scrapGeo, scrapMat);
        mesh.position.set(
          bp.x + (Math.random() - 0.5) * 0.6,
          bp.y + 0.5,
          bp.z + (Math.random() - 0.5) * 0.6
        );
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        scene.add(mesh);
        scrapItems.push({ mesh, pos: mesh.position.clone(), velY: 0, onGround: false, pickupTimer: 0 });
      }
    }

    function distToBlock(chunk, localId) {
      const bp = idxToWorldPos(chunk, localId);
      return Math.sqrt(
        (playerBody.position.x - bp.x) ** 2 +
        (playerBody.position.y - bp.y) ** 2 +
        (playerBody.position.z - bp.z) ** 2
      );
    }

    function resetBreak() {
      if (breakChunk && breakId >= 0) {
        breakChunk.mesh.setColorAt(breakId, white);
        breakChunk.mesh.instanceColor.needsUpdate = true;
      }
      isBreaking = false;
      breakProgress = 0;
      breakChunk = null;
      breakId = -1;
    }

    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || document.pointerLockElement !== renderer.domElement) return;
      isBreaking = true;
      breakNeedsTarget = true;
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0 && isBreaking) resetBreak();
    });
    function tryPlaceBlock() {
      if (countItem('paper_block') < 1) return;
      raycaster.setFromCamera({ x: 0, y: 0 }, camera);
      const hits = raycaster.intersectObjects(allChunkMeshes);
      if (!hits.length) return;
      const chunk = chunks.find(c => c && c.mesh === hits[0].object);
      if (!chunk) return;
      const hi = hits[0].instanceId;
      const bp = idxToWorldPos(chunk, hi);
      if (Math.sqrt((playerBody.position.x-bp.x)**2+(playerBody.position.y-bp.y)**2+(playerBody.position.z-bp.z)**2) > 5) return;
      const fn = hits[0].face.normal;
      const nx = Math.round(fn.x), ny = Math.round(fn.y), nz = Math.round(fn.z);
      const bx = Math.round(bp.x + halfX - 0.5) + nx;
      const by = Math.round(bp.y - 0.5) + ny;
      const bz = Math.round(bp.z + halfZ - 0.5) + nz;
      if (bx < 0 || bx >= gridX || bz < 0 || bz >= gridZ || by < 0 || by >= gridY) return;
      const px = playerBody.position.x, py = playerBody.position.y, pz = playerBody.position.z;
      if ((px-0.4) < (bx-halfX+1) && (px+0.4) > (bx-halfX) && (py-0.45) < (by+1) && (py+0.45) > by && (pz-0.05) < (bz-halfZ+1) && (pz+0.05) > (bz-halfZ)) return;
      const cxc = Math.floor(bx / CHUNK), czc = Math.floor(bz / CHUNK), cyc = Math.floor(by / CHUNK);
      const pChunk = getChunk(cxc, czc, cyc);
      if (!pChunk) return;
      const pId = chunkLocalIdx(pChunk, bx, bz, by);
      if (pChunk.states[pId] === 0) return;
      removeItems('paper_block', 1);
      pChunk.states[pId] = 0;
      scaleDummy.scale.set(1, 1, 1);
      scaleDummy.position.set(bx - halfX + 0.5, by + 0.5, bz - halfZ + 0.5);
      scaleDummy.updateMatrix();
      pChunk.mesh.setMatrixAt(pId, scaleDummy.matrix);
      pChunk.mesh.instanceMatrix.needsUpdate = true;
    }
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 2 && document.pointerLockElement === renderer.domElement) tryPlaceBlock();
    });
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    const velocity = new THREE.Vector3();
    let yaw = 0;
    let pitch = 0;
    let onGround = true;
    let thirdPerson = false;
    let isCrafting = false;
    let isBreaking = false;
    let breakProgress = 0;
    let breakChunk = null;
    let breakId = -1;
    let breakNeedsTarget = false;
    let velX = 0, velZ = 0;
    const white = new THREE.Color(0xffffff);

      jz.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; jActive = true; jId = t.identifier; const r = jz.getBoundingClientRect(); jCX = r.left + r.width/2; jCY = r.top + r.height/2; }, { passive: false });
      jz.addEventListener('touchmove', (e) => { e.preventDefault(); const t = Array.from(e.changedTouches).find(tt => tt.identifier === jId); if (!t) return; let dx = t.clientX - jCX, dy = t.clientY - jCY; const d = Math.sqrt(dx*dx+dy*dy); if (d > jr) { dx = dx/d*jr; dy = dy/d*jr; } jk.style.transform = 'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))'; velX = dx/jr; velZ = -dy/jr; }, { passive: false });
      jz.addEventListener('touchend', (e) => { const t = Array.from(e.changedTouches).find(tt => tt.identifier === jId); if (!t) return; jActive = false; velX = 0; velZ = 0; jk.style.transform = ''; }, { passive: false });

      tlook.addEventListener('touchstart', (e) => {

    document.getElementById('crafting').addEventListener('touchstart', (e) => {

    window.addEventListener('resize', () => {

    const inventory = Array.from({ length: 8 }, () => ({ type: null, count: 0, durability: [] }));
    let selectedSlot = 0;
    const srcMap = {
      water:'./Water Ball.png', paperball:'./Paper Ball.png',
      reinforced:'./Reinforced Paper Ball.png', scrap:'./Paper Scrap.png',
      plastic:'./Plastic Piece.png', glue:'./Glue.png',
      attachable:'./Attachable Paper Scrap.png', cartolina:'./Cartolina Scrap.png',
      shield:'./Paper Shield.png', reinforced_shield:'./Reinforced Paper Shield.png',
      paper_block:'./Paper Block.png', reinforced_block:'./Reinforced Paper Block.png'
    };

    function updateSlot(i) {
      const slot = document.getElementById('slot' + (i + 1));
      const it = inventory[i];
      slot.innerHTML = '';
      if (!it.type || it.count <= 0) { it.type = null; it.count = 0; it.durability = []; return; }
      const img = document.createElement('img'); img.className = 'item-img';
      img.src = srcMap[it.type] || './Paper Scrap.png';
      slot.appendChild(img);
      const label = document.createElement('div'); label.className = 'count';
      label.textContent = (it.type === 'shield' || it.type === 'reinforced_shield') ? (it.durability[0] ?? '') : it.count;
      slot.appendChild(label);
    }

    function updateInventoryUI() {
      for (let i = 0; i < inventory.length; i++) {
        const slot = document.getElementById('slot' + (i + 1));
        slot.classList.remove('selected');
        if (i === selectedSlot) slot.classList.add('selected');
      }
    }

    function addToInventory(type) {
      for (let i = 0; i < inventory.length; i++) {
        if (inventory[i].type === type && inventory[i].count > 0) {
          inventory[i].count++;
          if (type === 'shield') inventory[i].durability.push(40);
          if (type === 'reinforced_shield') inventory[i].durability.push(250);
          updateSlot(i); return true;
        }
      }
      for (let i = 0; i < inventory.length; i++) {
        if (inventory[i].type === null) {
          inventory[i].type = type; inventory[i].count = 1; inventory[i].durability = [];
          if (type === 'shield') inventory[i].durability.push(40);
          if (type === 'reinforced_shield') inventory[i].durability.push(250);
          updateSlot(i); return true;
        }
      }
      return false;
    }

    function removeItems(type, amt) {
      let needed = amt;
      for (let i = 0; i < inventory.length; i++) {
        if (inventory[i].type === type) {
          const take = Math.min(inventory[i].count, needed);
          inventory[i].count -= take;
          needed -= take;
          if (inventory[i].count <= 0) { inventory[i].type = null; inventory[i].durability = []; }
          updateSlot(i); if (needed <= 0) break;
        }
      }
    }

    function countItem(type) {
      let total = 0;
      for (const slot of inventory) {
        if (slot.type === type) total += slot.count;
      }
      return total;
    }

    const recipes = [
      { id: 'paper_block', name: 'Paper Block', result: 'paper_block', resultImg: './Paper Block.png', ingredients: [{ type: 'scrap', count: 8, img: './Paper Scrap.png' }] },
    ];
    let selectedRecipe = null;
    const recipeGrid = document.getElementById('recipeGrid');
    const craftBtn = document.getElementById('craftBtn');
    const selectedHint = document.getElementById('selectedHint');

    function buildRecipeGrid() {
      recipeGrid.innerHTML = '';
      for (const r of recipes) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.recipe = r.id;
        const costHtml = r.ingredients.map(i => `${i.count} <img src="${i.img}">`).join(' ');
        card.innerHTML = `<img src="${r.resultImg}"><div class="name">${r.name}</div><div class="cost">${costHtml}</div>`;
        card.addEventListener('click', () => {
          document.querySelectorAll('#recipeGrid .card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedRecipe = r.id;
          updateCraftButtons();

    document.getElementById('crafting').addEventListener('click', (e) => {

        document.getElementById('crafting').style.display = 'none';
      }
    });
    document.getElementById('crafting').addEventListener('touchstart', (e) => {
      if (e.target === e.currentTarget) {
        isCrafting = false;
        document.getElementById('crafting').style.display = 'none';
      }
    }, { passive: false });
        recipeGrid.appendChild(card);
      }
    }

    function canAffordRecipe(recipeId) {
      const r = recipes.find(x => x.id === recipeId);
      if (!r) return false;
      return r.ingredients.every(i => countItem(i.type) >= i.count);
    }

    function updateCraftButtons() {
      if (!selectedRecipe) {
        craftBtn.disabled = true;
        selectedHint.textContent = 'Select a recipe to make';
        return;
      }
      const canAfford = canAffordRecipe(selectedRecipe);
      craftBtn.disabled = !canAfford;
      selectedHint.textContent = canAfford ? 'Ready to make' : 'Not enough materials';
    }

    buildRecipeGrid();

    craftBtn.addEventListener('click', () => {
      if (!selectedRecipe || !canAffordRecipe(selectedRecipe)) return;
      const r = recipes.find(x => x.id === selectedRecipe);
      for (const ing of r.ingredients) {
        removeItems(ing.type, ing.count);
      }
      addToInventory(r.result);
      updateCraftButtons();
    });

    const clock = new THREE.Clock();
    let fpsFrames = 0;
    let fpsTime = 0;
    const fpsEl = document.getElementById('fps');

    function animate() {
      requestAnimationFrame(animate);
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.05);
      fpsFrames++;
      fpsTime += rawDt;
      if (fpsTime >= 0.5) {
        fpsEl.textContent = Math.round(fpsFrames / fpsTime) + ' FPS';
        fpsFrames = 0;
        fpsTime = 0;
      }

      playerBody.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0));

      if (thirdPerson) {
        const dist = 4;
        const offset = new THREE.Vector3(
          dist * Math.sin(yaw) * Math.cos(-pitch),
          dist * Math.sin(-pitch) + 1.5,
          dist * Math.cos(yaw) * Math.cos(-pitch)
        );
        camera.position.copy(playerBody.position).add(offset);
        camera.lookAt(playerBody.position.x, playerBody.position.y + 1, playerBody.position.z);
      } else {
        const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);
        camera.position.copy(playerBody.position);
        camera.position.y += 0.4;
      }

      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      forward.y = 0;
      forward.normalize();
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      right.y = 0;
      right.normalize();

      const moveDir = new THREE.Vector3();
      if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
      if (velX !== 0 || velZ !== 0) {
        moveDir.add(right.clone().multiplyScalar(velX));
        moveDir.add(forward.clone().multiplyScalar(velZ));
      }

      if (moveDir.length() > 0) {
        moveDir.normalize();
        velocity.x = moveDir.x * 5;
        velocity.z = moveDir.z * 5;
      } else {
        velocity.x *= 0.7;
        velocity.z *= 0.7;
      }

      velocity.y -= 20 * dt;

      function blockedInDir(px, py, pz, dx, dz) {
        const hwX = 0.4, hwZ = 0.1, hh = 0.45, eps = 0.001;
        const edgeX = px + dx * hwX;
        const edgeZ = pz + dz * hwZ;
        const bx = Math.floor(edgeX + halfX + (dx > 0 ? eps : (dx < 0 ? -eps : 0)));
        const bz = Math.floor(edgeZ + halfZ + (dz > 0 ? eps : (dz < 0 ? -eps : 0)));
        const minBY = Math.floor(py - hh + eps);
        const maxBY = Math.floor(py + hh - eps);
        for (let by = minBY; by <= maxBY; by++) {
          if (by >= 0 && by < gridY && isSolidBlock(bx, bz, by)) return true;
        }
        return false;
      }

      if (playerCollidesAt(playerBody.position.x, playerBody.position.y, playerBody.position.z)) {
        const px = playerBody.position.x, py = playerBody.position.y, pz = playerBody.position.z;
        for (const [dx, dz] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          for (let d = 0.1; d <= 1.5; d += 0.1) {
            const tx = px + dx * d, tz = pz + dz * d;
            if (!playerCollidesAt(tx, py, tz)) {
              playerBody.position.x = tx;
              playerBody.position.z = tz;
              break;
            }
          }
          if (!playerCollidesAt(playerBody.position.x, playerBody.position.y, playerBody.position.z)) break;
        }
      }

      if (velocity.x !== 0) {
        const nextX = playerBody.position.x + velocity.x * dt;
        const dirX = Math.sign(velocity.x);
        if (!blockedInDir(nextX, playerBody.position.y, playerBody.position.z, dirX, 0)) {
          playerBody.position.x = nextX;
        } else {
          velocity.x = 0;
        }
      }
      if (velocity.z !== 0) {
        const nextZ = playerBody.position.z + velocity.z * dt;
        const dirZ = Math.sign(velocity.z);
        if (!blockedInDir(playerBody.position.x, playerBody.position.y, nextZ, 0, dirZ)) {
          playerBody.position.z = nextZ;
        } else {
          velocity.z = 0;
        }
      }

      playerBody.position.y += velocity.y * dt;
      if (velocity.y > 0) {
        const hy = playerBody.position.y + 0.45, hyB = Math.floor(hy + 0.001);
        const mnX = Math.floor(playerBody.position.x - 0.4 + halfX), mxX = Math.floor(playerBody.position.x + 0.4 + halfX - 0.001);
        const mnZ = Math.floor(playerBody.position.z - 0.05 + halfZ), mxZ = Math.floor(playerBody.position.z + 0.05 + halfZ - 0.001);
        let hit = false;
        for (let bx = mnX; bx <= mxX && !hit; bx++) {
          for (let bz = mnZ; bz <= mxZ && !hit; bz++) {
            if (hyB >= 0 && hyB < gridY && isSolidBlock(bx, bz, hyB)) {
              playerBody.position.y = hyB - 0.45; velocity.y = 0; hit = true;
            }
          }
        }
      }

      const bound = halfX - 1;
      playerBody.position.x = Math.max(-bound, Math.min(bound, playerBody.position.x));
      playerBody.position.z = Math.max(-bound, Math.min(bound, playerBody.position.z));

      const bx = Math.floor(playerBody.position.x + halfX);
      const bz = Math.floor(playerBody.position.z + halfZ);
      if (bx >= 0 && bx < gridX && bz >= 0 && bz < gridZ) {
        let groundBlockY = -1;
        const cxc = Math.floor(bx / CHUNK), czc = Math.floor(bz / CHUNK);
        for (let cy = chY - 1; cy >= 0; cy--) {
          const chunk = getChunk(cxc, czc, cy);
          if (!chunk) continue;
          for (let ly = chunk.ny - 1; ly >= 0; ly--) {
            const blockY = chunk.sy + ly;
            const blockTop = blockY + 1;
            if (blockTop > playerBody.position.y) continue;
            const localId = chunkLocalIdx(chunk, bx, bz, blockY);
            if (localId >= 0 && localId < chunk.states.length && chunk.states[localId] === 0) {
              groundBlockY = blockY;
              break;
            }
          }
          if (groundBlockY >= 0) break;
        }
        if (groundBlockY >= 0) {
          const snapY = groundBlockY + 1 + PH / 2;
          if (playerBody.position.y <= snapY + 0.05 && velocity.y <= 0) {
            playerBody.position.y = snapY;
            velocity.y = 0;
            onGround = true;
          } else {
            onGround = false;
          }
        } else {
          if (playerBody.position.y <= PH / 2 - 0.01) {
            playerBody.position.y = PH / 2 - 0.01;
            velocity.y = 0;
            onGround = true;
          } else {
            onGround = false;
          }
        }
      } else {
        if (playerBody.position.y <= PH / 2 - 0.01) {
          playerBody.position.y = PH / 2 - 0.01;
          velocity.y = 0;
          onGround = true;
        } else {
          onGround = false;
        }
      }

      if (keys['Space'] && onGround) {
        velocity.y = 7;
        onGround = false;
      }

      for (let i = scrapItems.length - 1; i >= 0; i--) {
        const s = scrapItems[i];
        const dx = playerBody.position.x - s.pos.x;
        const dz = playerBody.position.z - s.pos.z;
        const dist2 = dx * dx + dz * dz;
        if (dist2 > renderDist * renderDist) {
          s.mesh.visible = false;
          s.pickupTimer = 0;
          continue;
        }
        s.mesh.visible = true;

        if (!s.onGround) {
          const prevY = s.pos.y;
          s.velY -= 20 * dt;
          s.pos.y += s.velY * dt;
          const sbx = Math.floor(s.pos.x + halfX);
          const sbz = Math.floor(s.pos.z + halfZ);
          if (sbx >= 0 && sbx < gridX && sbz >= 0 && sbz < gridZ) {
            let groundY = -1;
            const cxc = Math.floor(sbx / CHUNK), czc = Math.floor(sbz / CHUNK);
            for (let cy = chY - 1; cy >= 0; cy--) {
              const chunk = getChunk(cxc, czc, cy);
              if (!chunk) continue;
              for (let ly = chunk.ny - 1; ly >= 0; ly--) {
                const blockY = chunk.sy + ly;
                const blockTop = blockY + 1;
                if (blockTop > prevY) continue;
                const localId = chunkLocalIdx(chunk, sbx, sbz, blockY);
                if (localId >= 0 && localId < chunk.states.length && chunk.states[localId] === 0) {
                  groundY = blockY;
                  break;
                }
              }
              if (groundY >= 0) break;
            }
            if (groundY >= 0 && s.pos.y <= groundY + 1 + 0.04) {
              s.pos.y = groundY + 1 + 0.04;
              s.velY = 0;
              s.onGround = true;
            }
          }
          if (s.pos.y < 0.04) {
            s.pos.y = 0.04;
            s.velY = 0;
            s.onGround = true;
          }
          s.mesh.position.y = s.pos.y;
        } else {
          const sbx = Math.floor(s.pos.x + halfX);
          const sbz = Math.floor(s.pos.z + halfZ);
          const belowY = Math.floor(s.pos.y - 0.05);
          if (sbx < 0 || sbx >= gridX || sbz < 0 || sbz >= gridZ || belowY < 0 || belowY >= gridY || !isSolidBlock(sbx, sbz, belowY)) {
            s.onGround = false;
            s.velY = 0;
          }
        }

        if (dist2 < 1.5 * 1.5) {
          s.pickupTimer += dt;
          if (s.pickupTimer >= 0.7) {
            scene.remove(s.mesh);
            addToInventory('scrap');
            scrapItems.splice(i, 1);
          }
        } else {
          s.pickupTimer = 0;
        }
      }

      if (isBreaking) {
        if (breakNeedsTarget) {
          breakNeedsTarget = false;
          raycaster.setFromCamera({ x: 0, y: 0 }, camera);
          const hits = raycaster.intersectObjects(allChunkMeshes);
          if (hits.length) {
            const chunk = chunks.find(c => c && c.mesh === hits[0].object);
            if (chunk) {
              const hid = hits[0].instanceId;
              if (chunk.states[hid] === 0 && distToBlock(chunk, hid) <= 5) {
                breakChunk = chunk;
                breakId = hid;
                breakProgress = 0;
              }
            }
          }
        }
        if (breakChunk && breakId >= 0) {
          if (distToBlock(breakChunk, breakId) > 5) {
            resetBreak();
            breakNeedsTarget = true;
          } else {
            breakProgress += dt;
            const t = Math.min(breakProgress, 1);
            const color = new THREE.Color().lerpColors(white, black, t);
            breakChunk.mesh.setColorAt(breakId, color);
            breakChunk.mesh.instanceColor.needsUpdate = true;
            if (breakProgress >= 1) {
              breakBlock(breakChunk, breakId);
              breakChunk = null; breakId = -1; breakProgress = 0;
              breakNeedsTarget = true;
            }
          }
        }
      }

      const rd2c = (renderDist + CHUNK) * (renderDist + CHUNK);
      for (let i = 0; i < chunks.length; i++) {
        const c = chunks[i];
        if (!c) continue;
        const dx = c.center.x - playerBody.position.x;
        const dy = c.center.y - playerBody.position.y;
        const dz = c.center.z - playerBody.position.z;
        const far = dx * dx + dy * dy + dz * dz > rd2c;
        if (far !== c.isFar) {
          c.isFar = far;
          c.mesh.visible = !far;
        }
      }

      dir.target.position.copy(playerBody.position);
      dir.target.updateMatrixWorld();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
