<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Papercore - Main Menu</title>
  <link rel="icon" type="image/png" href="./Paper.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:"Poppins",sans-serif; overflow:hidden; background:linear-gradient(135deg,#e0e0e0,#ffffff); background-attachment:fixed; }
    #menu { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px; box-sizing:border-box; }
    h1 { font-size:72px; font-weight:900; text-shadow:2px 2px 0 #000; margin-bottom:40px; letter-spacing:4px; }
    .btn { padding:15px 30px; font-size:20px; font-family:"Poppins",sans-serif; font-weight:700; border:3px solid black; background:white; cursor:pointer; box-shadow:4px 4px 0 black; margin:10px; min-width:220px; transition:0.15s; }
    .btn:hover { background:#eee; transform:translate(-2px,-2px); box-shadow:6px 6px 0 black; }
    .btn:active { transform:translate(0,0); box-shadow:4px 4px 0 black; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:4px 4px 0 black; }
    #auth-section { margin-bottom:20px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    #auth-section input { padding:10px 14px; font-size:16px; font-family:"Poppins",sans-serif; border:2px solid #c4b5fd; border-radius:8px; outline:none; width:240px; box-sizing:border-box; }
    #auth-section .btn { min-width:auto; padding:10px 24px; font-size:16px; }
    #user-info { font-size:16px; color:#4c1d95; font-weight:700; margin-bottom:12px; }
    #error-msg { color:#dc2626; font-size:14px; font-weight:600; min-height:20px; }
  </style>
</head>
<body>
  <div id="menu">
    <h1>PAPERCORE</h1>
    <div id="auth-section">
      <div id="user-info"></div>
      <input type="email" id="email-input" placeholder="Email">
      <input type="password" id="password-input" placeholder="Password">
      <div>
        <button class="btn" id="sign-in-btn">SIGN IN</button>
        <button class="btn" id="sign-up-btn">SIGN UP</button>
      </div>
      <button class="btn" id="google-btn">SIGN IN WITH GOOGLE</button>
      <div id="error-msg"></div>
    </div>
    <button class="btn" id="playBtn" disabled>SINGLE PLAYER</button>
    <button class="btn" id="server1Btn" disabled>SERVER 1 — PLAY</button>
    <div id="auth-loading" style="display:none;margin-top:10px;font-size:18px;font-weight:700;color:#6d28d9;">Loading...</div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBDBaTP1y_jTsONYc90d4krMgIOL9L2NFI",
      authDomain: "papercore-online.firebaseapp.com",
      projectId: "papercore-online",
      storageBucket: "papercore-online.firebasestorage.app",
      messagingSenderId: "628416077509",
      appId: "1:628416077509:web:6a37a665e6c59f44b7daac"
    };
    firebase.initializeApp(firebaseConfig);

    const userInfo = document.getElementById('user-info');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const signInBtn = document.getElementById('sign-in-btn');
    const signUpBtn = document.getElementById('sign-up-btn');
    const googleBtn = document.getElementById('google-btn');
    const errorMsg = document.getElementById('error-msg');
    const playBtn = document.getElementById('playBtn');
    const server1Btn = document.getElementById('server1Btn');
    const authLoading = document.getElementById('auth-loading');

    let currentUser = null;

    function updateUI(user) {
      currentUser = user;
      if (user) {
        userInfo.textContent = 'Signed in as ' + (user.displayName || user.email);
        emailInput.style.display = 'none';
        passwordInput.style.display = 'none';
        signInBtn.style.display = 'none';
        signUpBtn.style.display = 'none';
        googleBtn.style.display = 'none';
        playBtn.disabled = false;
        server1Btn.disabled = false;
      } else {
        userInfo.textContent = '';
        emailInput.style.display = 'block';
        passwordInput.style.display = 'block';
        signInBtn.style.display = 'inline-block';
        signUpBtn.style.display = 'inline-block';
        googleBtn.style.display = 'inline-block';
        playBtn.disabled = true;
        server1Btn.disabled = true;
      }
      errorMsg.textContent = '';
    }

    firebase.auth().onAuthStateChanged((user) => {
      updateUI(user);
    });

    signInBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const pass = passwordInput.value;
      if (!email || !pass) { errorMsg.textContent = 'Enter email and password'; return; }
      authLoading.style.display = 'block';
      try {
        await firebase.auth().signInWithEmailAndPassword(email, pass);
      } catch(e) {
        errorMsg.textContent = e.message;
      }
      authLoading.style.display = 'none';
    });

    signUpBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const pass = passwordInput.value;
      if (!email || !pass) { errorMsg.textContent = 'Enter email and password'; return; }
      if (pass.length < 6) { errorMsg.textContent = 'Password must be at least 6 characters'; return; }
      authLoading.style.display = 'block';
      try {
        await firebase.auth().createUserWithEmailAndPassword(email, pass);
      } catch(e) {
        errorMsg.textContent = e.message;
      }
      authLoading.style.display = 'none';
    });

    googleBtn.addEventListener('click', async () => {
      authLoading.style.display = 'block';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await firebase.auth().signInWithPopup(provider);
      } catch(e) {
        errorMsg.textContent = e.message;
      }
      authLoading.style.display = 'none';
    });

    playBtn.addEventListener('click', () => {
      window.location.href = 'game.html';
    });

    server1Btn.addEventListener('click', () => {
      window.location.href = 'game.html?world=server1&mode=load';
    });
  </script>
</body>
</html>
